<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>منصة QR للمحلات</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --teal:#0d7a72; --teal-d:#0a5f59; --teal-l:#e8f4f3; --bg:#f3f6f8; --card:#fff; --ink:#14222b;
  --muted:#6b7c86; --line:#e6eef0; --ok:#16a34a; --warn:#f59e0b; --err:#ef4444;
  --shadow:0 10px 30px rgba(20,40,50,.08); --shadow-sm:0 4px 12px rgba(20,40,50,.05);
  --c1:#0d7a72; --c2:#14b8a6; --c3:#0d7a72; --c4:#14b8a6; --c5:#0d7a72;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif}
button,input,textarea,select{font-family:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
img{max-width:100%}
.hidden{display:none!important}

/* Container responsive */
.app-shell{display:flex;justify-content:center;min-height:100vh;background:var(--bg)}
.phone{width:100%;max-width:440px;min-height:100vh;background:#fff;position:relative;box-shadow:0 0 50px rgba(0,0,0,.06)}

/* Utilities */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:14px;font-weight:800;font-size:15px;transition:transform .1s,opacity .15s}
.btn:active{transform:scale(0.98)}
.btn-teal{background:var(--teal);color:#fff}
.btn-teal:hover{background:var(--teal-d)}
.btn-teal:disabled{opacity:.6;cursor:not-allowed}
.btn-outline{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn-outline:hover{background:#f8fbfb;border-color:var(--teal)}
.btn-ghost{background:transparent;border:0;color:var(--teal);font-weight:800}
.btn-sm{padding:8px 12px;font-size:12px;border-radius:10px}
.pad{padding:0 20px 24px}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:20px}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid rgba(0,0,0,.03)}
.back{background:none;border:0;color:var(--teal);font-weight:800;font-size:14px;display:inline-flex;align-items:center;gap:4px}
.lock{width:64px;height:64px;border-radius:50%;background:var(--teal-l);color:var(--teal);display:grid;place-items:center;margin:8px auto 12px;font-size:28px}
.field{margin-bottom:12px;text-align:right}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.inp{position:relative}
.inp input,.inp textarea,.inp select{width:100%;border:1px solid var(--line);background:#f8fbfb;border-radius:12px;padding:12px 40px 12px 14px;font-size:14px;outline:none;transition:border-color .2s,background .2s}
.inp textarea{min-height:78px;resize:vertical;padding-right:14px}
.inp input:focus,.inp textarea:focus{border-color:var(--teal);background:#fff}
.inp .ico{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px;pointer-events:none}
.inp .eye{left:12px;right:auto;background:none;border:0;color:var(--muted);cursor:pointer;pointer-events:auto}
.err{background:#fef2f2;color:#b91c1c;border-radius:12px;padding:10px 14px;font-size:13px;margin:10px 0;line-height:1.5}
.ok{background:#ecfdf5;color:#047857;border-radius:12px;padding:10px 14px;font-size:13px;margin:10px 0}
.muted{color:var(--muted);font-size:13px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:8px;font-size:11px;font-weight:700}
.badge-teal{background:var(--teal-l);color:var(--teal)}
.badge-demo{background:#fef3c7;color:#92400e}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 20px;border-radius:99px;font-size:13px;font-weight:700;z-index:100;box-shadow:0 10px 30px rgba(0,0,0,.25);pointer-events:none;animation:fadeIn .2s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

/* Hero Home */
.hero{padding:48px 22px 24px;text-align:center}
.qr-mark{width:78px;height:78px;margin:0 auto 16px;border-radius:22px;background:linear-gradient(180deg,#128f85,#0d7a72);display:grid;place-items:center;box-shadow:0 12px 24px rgba(13,122,114,.28);color:#fff}
.hero h1{font-size:25px;font-weight:800;margin-bottom:8px;color:#0f172a}
.hero p{color:var(--muted);line-height:1.7;font-size:14px;max-width:320px;margin:0 auto}

/* Dashboard */
.dash-wrap{min-height:100vh;background:linear-gradient(180deg,#e8f4f3 0%,var(--bg) 140px);padding-bottom:30px}
.dash-h{padding:16px 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.dash-h h2{font-size:21px;font-weight:800}
.add{background:var(--teal);color:#fff;border:0;border-radius:12px;padding:10px 14px;font-weight:800;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:8px 16px 14px}
.kpi{background:#fff;border-radius:16px;padding:12px 6px;text-align:center;box-shadow:var(--shadow-sm);border:1px solid rgba(0,0,0,.03)}
.kpi b{display:block;font-size:19px;color:var(--ink)}
.kpi span{font-size:11px;color:var(--muted);font-weight:700}
.search-box{padding:0 16px 12px}
.search-box input{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font-size:13px;outline:none}
.shop-card{margin:0 16px 12px;background:#fff;border-radius:18px;box-shadow:var(--shadow-sm);border:1px solid rgba(0,0,0,.03);overflow:hidden;transition:transform .15s}
.shop-card:hover{transform:translateY(-2px)}
.shop-card .row{display:flex;gap:12px;padding:14px;align-items:center}
.shop-card img,.ph{width:56px;height:56px;border-radius:14px;object-fit:cover;background:#d7ecea;flex-shrink:0}
.ph{display:grid;place-items:center;color:var(--teal);font-weight:800;font-size:22px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-left:4px}
.dot.on{background:#22c55e}.dot.off{background:#94a3b8}
.metrics{display:flex;gap:14px;padding:0 14px 10px;color:var(--muted);font-size:12px;font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 14px}
.actions button,.actions a{background:#f3f6f8;border:0;border-radius:10px;padding:7px 11px;font-size:12px;font-weight:800;color:var(--ink);display:inline-flex;align-items:center;gap:4px;transition:background .15s}
.actions button:hover,.actions a:hover{background:#e6eef0}

/* Form */
.steps{display:flex;justify-content:center;gap:8px;padding:10px}
.steps i{width:46px;height:6px;border-radius:99px;background:#d9e6e5;transition:background .2s}
.steps i.on{background:var(--teal)}
.mini{background:#f8fbfb;border:1px dashed var(--line);border-radius:14px;padding:14px;text-align:center;font-size:12px;font-weight:700;cursor:pointer;position:relative}
.mini input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.mini img{max-height:70px;border-radius:8px;margin-top:6px}
.colors{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #dbe5e6;cursor:pointer;transition:transform .15s}
.sw:hover{transform:scale(1.15)}
.color-slots{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.color-slot{width:40px;height:40px;border-radius:10px;border:2px dashed var(--line);display:grid;place-items:center;font-size:11px;color:var(--muted);position:relative}
.color-slot.has{border-style:solid;border-color:transparent}
.color-slot .rm{position:absolute;top:-6px;left:-6px;width:18px;height:18px;border-radius:50%;background:#ef4444;color:#fff;font-size:10px;border:0;display:grid;place-items:center}
.custom-link-card{background:#f8fbfb;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;position:relative}
.custom-link-card .rm-custom{position:absolute;top:8px;left:8px;width:24px;height:24px;border-radius:50%;background:#fee2e2;color:#b91c1c;border:0;font-weight:800;font-size:13px;display:grid;place-items:center}
.type-toggle{display:flex;gap:6px;margin-bottom:8px}
.type-toggle button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px;font-size:12px;font-weight:700}
.type-toggle button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.type-toggle button.store-on{background:#f97316;color:#fff;border-color:#f97316}
.color-pick-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.color-pick-row input[type=color]{width:34px;height:34px;border:0;padding:0;background:none;cursor:pointer}

/* Customer shop */
.shop-page{min-height:100vh;background:#eef3f5;padding-bottom:40px;position:relative}
.shop-topbar{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:10}
.shop-icon-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.9);backdrop-filter:blur(6px);border:0;display:grid;place-items:center;box-shadow:0 4px 10px rgba(0,0,0,.15);color:var(--ink)}
.cover{height:170px;background:linear-gradient(135deg,var(--c1),var(--c2),var(--c3));position:relative;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover}
.avatar-wrap{display:flex;justify-content:center;margin-top:-46px;position:relative;z-index:2}
.avatar{width:92px;height:92px;border-radius:50%;background:#fff;border:5px solid #fff;box-shadow:0 8px 20px rgba(0,0,0,.12);overflow:hidden;display:grid;place-items:center;font-size:32px;font-weight:800;color:var(--c1)}
.avatar img{width:100%;height:100%;object-fit:cover}
.shop-name{text-align:center;margin:10px 0 6px;font-size:22px;font-weight:800;color:#0f172a;padding:0 16px}
.swipes{padding:0 18px}
.swipe{margin-bottom:12px;user-select:none;position:relative;touch-action:pan-y}
.track{height:58px;border-radius:16px;display:flex;align-items:center;padding:0 10px;color:#fff;position:relative;overflow:hidden;box-shadow:0 8px 16px rgba(0,0,0,.12);cursor:pointer}
.handle{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.25);display:grid;place-items:center;flex:0 0 42px;position:absolute;right:8px;top:50%;transform:translateY(-50%);z-index:3;box-shadow:0 2px 8px rgba(0,0,0,.15);transition:none;cursor:grab;touch-action:none}
.handle:active{cursor:grabbing}
.handle svg{width:20px;height:20px}
.track b{flex:1;text-align:right;padding:0 58px 0 10px;font-size:15px;pointer-events:none}
.ic{width:34px;height:34px;display:grid;place-items:center;pointer-events:none;margin-left:4px}
.hint{text-align:center;color:var(--muted);font-size:12px;margin-top:16px;font-weight:700;padding:0 20px}
.promo{margin:14px 18px 0;background:#fff;border-radius:14px;padding:11px;text-align:center;font-weight:700;color:var(--c1);font-size:13px;box-shadow:var(--shadow-sm)}

/* Overlay */
.ov{position:fixed;inset:0;background:rgba(11,11,15,.96);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:24px}
.ov .spin{width:80px;height:80px;border-radius:50%;border:4px solid #333;border-top-color:#fff;animation:sp 1s linear infinite;margin-bottom:16px}
.ov .check{width:80px;height:80px;border-radius:50%;background:#16a34a;display:grid;place-items:center;font-size:38px;margin-bottom:16px;box-shadow:0 10px 30px rgba(22,163,74,.4)}
@keyframes sp{to{transform:rotate(360deg)}}

/* Image preview modal */
.img-preview-ov{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:110;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.img-preview-ov img{max-width:95%;max-height:75vh;border-radius:14px;object-fit:contain;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.img-preview-ov .close-prev{margin-top:16px;background:#fff;color:#111;border:0;border-radius:12px;padding:12px 28px;font-weight:800;font-size:14px}

/* Stats */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 16px}
.stat-grid .b{background:#fff;border-radius:14px;padding:12px 8px;text-align:center;box-shadow:var(--shadow-sm);font-size:12px;border:1px solid rgba(0,0,0,.03)}
.stat-grid .b b{display:block;font-size:20px;margin-top:4px;color:var(--teal)}
.stat-filters{padding:6px 16px;display:flex;flex-wrap:wrap;gap:6px}
.stat-filters button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 11px;font-size:11px;font-weight:700}
.stat-filters button.on{background:var(--teal);color:#fff;border-color:var(--teal)}

/* QR Card & Print */
.qr-preview-card{background:#fff;border-radius:22px;padding:22px;text-align:center;box-shadow:var(--shadow);margin-bottom:16px;border:1px solid var(--line)}
.qr-preview-card .shop-title{font-size:20px;font-weight:800;margin-top:10px}
.qr-preview-card .shop-desc{font-size:13px;color:var(--muted);margin-bottom:14px}
.qr-canvas-holder{display:inline-block;padding:12px;background:#fff;border-radius:16px;box-shadow:0 6px 18px rgba(0,0,0,.08);margin-bottom:12px}

/* Table Stand Card Layout */
.stand-sheet{background:#fff;border:2px dashed #cbd5e1;border-radius:20px;padding:28px 20px;text-align:center;margin:16px;position:relative}
.stand-sheet .stand-logo{width:70px;height:70px;border-radius:50%;margin:0 auto 10px;object-fit:cover;border:3px solid var(--teal)}
.stand-sheet .stand-head{font-size:22px;font-weight:800;color:var(--ink);margin-bottom:4px}
.stand-sheet .stand-sub{font-size:13px;color:var(--muted);margin-bottom:16px}
.stand-sheet .stand-qr{width:200px;height:200px;margin:0 auto 14px;border:1px solid #e2e8f0;border-radius:14px;padding:8px}
.stand-sheet .stand-instructions{font-size:12px;font-weight:700;color:var(--teal);background:var(--teal-l);padding:8px 14px;border-radius:99px;display:inline-block}

/* Print Rules */
@media print{
  body{background:#fff!important;color:#000!important}
  .app-shell,.phone{max-width:100%!important;box-shadow:none!important;min-height:auto!important}
  .top,.actions,.btn,.hint,.no-print{display:none!important}
  .stand-sheet{border:2px solid #000!important;margin:0 auto!important;max-width:480px!important;padding:40px 20px!important;page-break-inside:avoid}
  .stand-sheet .stand-qr{width:240px!important;height:240px!important}
}

/* Modal tabs */
.cfg-tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--line);padding-bottom:6px}
.cfg-tab{background:none;border:none;padding:6px 12px;font-size:13px;font-weight:700;color:var(--muted);border-radius:8px;cursor:pointer}
.cfg-tab.active{background:var(--teal-l);color:var(--teal)}
.domain-badge{background:#e0f2fe;color:#0369a1;border:1px solid #bae6fd;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700}
.sec-shield{display:inline-flex;align-items:center;gap:5px;background:#f1f5f9;border:1px solid #cbd5e1;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700;color:#475569;margin-bottom:10px}
.deceptive-hint{color:#dc2626;background:#fef2f2;border:1px solid #fecaca;padding:9px 12px;border-radius:10px;font-size:12px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:6px}

/* Biometric & Face ID Styles (Apple iOS Style) */
.bio-scanner-box{position:relative;width:230px;height:230px;margin:0 auto 16px;border-radius:36px;overflow:hidden;background:#090d16;border:2.5px solid #0ea5e9;box-shadow:0 12px 35px rgba(14,165,233,0.3);display:flex;align-items:center;justify-content:center}
.bio-scanner-box.apple-verified{border-color:#22c55e;background:#052e16;box-shadow:0 12px 40px rgba(34,197,94,0.45)}
.bio-scanner-box video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bio-laser{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#38bdf8,#22c55e,#38bdf8,transparent);box-shadow:0 0 14px #22c55e;animation:scanBeam 1.8s ease-in-out infinite;z-index:4}
@keyframes scanBeam{0%{top:4%}50%{top:92%}100%{top:4%}}
.bio-reticle{position:absolute;inset:16px;border:1px dashed rgba(56,189,248,0.35);border-radius:24px;pointer-events:none;z-index:3}
.bio-corner{position:absolute;width:18px;height:18px;border-color:#38bdf8;border-style:solid;border-width:0;transition:all .3s}
.bio-corner.tl{top:0;left:0;border-top-width:3.5px;border-left-width:3.5px;border-top-left-radius:12px}
.bio-corner.tr{top:0;right:0;border-top-width:3.5px;border-right-width:3.5px;border-top-right-radius:12px}
.bio-corner.bl{bottom:0;left:0;border-bottom-width:3.5px;border-left-width:3.5px;border-bottom-left-radius:12px}
.bio-corner.br{bottom:0;right:0;border-bottom-width:3.5px;border-right-width:3.5px;border-bottom-right-radius:12px}
.bio-scanner-box.apple-verified .bio-corner{border-color:#22c55e}

/* Apple iOS Animated Checkmark */
.apple-check-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;animation:applePop .38s cubic-bezier(0.175,0.885,0.32,1.275)}
@keyframes applePop{0%{transform:scale(0.35);opacity:0}100%{transform:scale(1);opacity:1}}
.apple-check-svg{width:88px;height:88px}
.apple-circle-path{stroke:#22c55e;stroke-width:3.5;stroke-dasharray:283;stroke-dashoffset:283;animation:drawCircle 0.5s cubic-bezier(0.65,0,0.45,1) forwards;fill:none}
.apple-check-path{stroke:#22c55e;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:50;stroke-dashoffset:50;animation:drawCheck 0.35s cubic-bezier(0.65,0,0.45,1) 0.25s forwards;fill:none}
@keyframes drawCircle{100%{stroke-dashoffset:0}}
@keyframes drawCheck{100%{stroke-dashoffset:0}}

/* In-App Native Fingerprint Sensor */
.bio-fp-area{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;background:#f0fdf4;border:2px solid #86efac;border-radius:18px;margin-top:6px;cursor:pointer;transition:all .2s;user-select:none;-webkit-user-select:none}
.bio-fp-area:active,.bio-fp-area.active{background:#dcfce7;border-color:#22c55e;box-shadow:0 0 0 6px rgba(34,197,94,0.25)}
.bio-fp-icon{width:56px;height:56px;color:#16a34a;transition:all .3s}
.bio-fp-area.scanning .bio-fp-icon{animation:fpGlow 1s ease-in-out infinite}
@keyframes fpGlow{0%,100%{filter:drop-shadow(0 0 2px #22c55e);transform:scale(1)}50%{filter:drop-shadow(0 0 10px #22c55e);transform:scale(1.08)}}

/* Card shake animation for wrong password */
.shake{animation:shakeCard 0.45s cubic-bezier(0.36,0.07,0.19,0.97) both}
@keyframes shakeCard{10%,90%{transform:translate3d(-2px,0,0)}20%,80%{transform:translate3d(4px,0,0)}30%,50%,70%{transform:translate3d(-6px,0,0)}40%,60%{transform:translate3d(6px,0,0)}}

/* Hosting & Cloudflare Guide Styles */
.guide-tab-nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.guide-tab-btn{background:#f8fafc;border:1px solid #e2e8f0;padding:8px 14px;border-radius:10px;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;cursor:pointer}
.guide-tab-btn.active{background:var(--teal);border-color:var(--teal);color:#fff}
.guide-step-card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:14px;margin-bottom:10px}
.dns-record-row{display:flex;align-items:center;justify-content:space-between;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:8px 12px;margin-top:6px;font-size:12px;direction:ltr}
.dns-copy-btn{background:#fff;border:1px solid #cbd5e1;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;color:var(--ink)}
.ext-link-btn{display:inline-flex;align-items:center;gap:6px;background:var(--teal);color:#fff;text-decoration:none;font-size:12px;font-weight:700;padding:8px 14px;border-radius:10px;margin-top:8px}
</style>
</head>
<body>
<div class="app-shell">
  <div id="app" class="phone">
    <div class="hero">
      <div class="qr-mark"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4z"/><path d="M14 14h2v2h-2zM18 14h2v2h-2zM14 18h2v2h-2zM18 18h2v2h-2z"/></svg></div>
      <h1>منصة QR للمحلات</h1>
      <p class="muted">جاري تشغيل المنصة...</p>
    </div>
  </div>
</div>

// Security layer: SHA-256 hash of secret key AL
const SEC_HASH_AL = 'b7aea05ac84d296afc2f35daec1541dda23ec7466ea0544d19270877e2a2c41a';

async function sha256Hex(str){
  if(window.crypto && window.crypto.subtle){
    const msgBuffer = new TextEncoder().encode(str);
    const hashBuffer = await window.crypto.subtle.digest('SHA-256', msgBuffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  }
  let h = 0x811c9dc5;
  for(let i=0; i<str.length; i++){
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return (h >>> 0).toString(16);
}

// Apple iOS authentic Face ID / Touch ID success chime
function playSuccessChime(){
  try{
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if(!AudioCtx) return;
    const ctx = new AudioCtx();
    const now = ctx.currentTime;
    
    // Note 1: E5 (659.25Hz)
    const osc1 = ctx.createOscillator();
    const gain1 = ctx.createGain();
    osc1.type = 'sine';
    osc1.frequency.setValueAtTime(659.25, now);
    gain1.gain.setValueAtTime(0, now);
    gain1.gain.linearRampToValueAtTime(0.18, now + 0.02);
    gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
    osc1.connect(gain1);
    gain1.connect(ctx.destination);
    osc1.start(now);
    osc1.stop(now + 0.35);

    // Note 2: B5 (987.77Hz - high confirmation ding)
    const osc2 = ctx.createOscillator();
    const gain2 = ctx.createGain();
    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(987.77, now + 0.09);
    gain2.gain.setValueAtTime(0, now + 0.09);
    gain2.gain.linearRampToValueAtTime(0.24, now + 0.11);
    gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
    osc2.connect(gain2);
    gain2.connect(ctx.destination);
    osc2.start(now + 0.09);
    osc2.stop(now + 0.55);
  }catch(e){}
}

// Real Client-Side Facial Feature Extractor (256-D Normalized Vector)
function extractFaceFeatures(videoOrCanvas){
  try{
    const cvs = document.createElement('canvas');
    cvs.width = 64;
    cvs.height = 64;
    const ctx = cvs.getContext('2d', { willReadFrequently: true });
    if(!ctx) return { hasFace: false, vector: [], skinRatio: 0, avgLum: 0 };

    const srcW = videoOrCanvas.videoWidth || videoOrCanvas.width || 320;
    const srcH = videoOrCanvas.videoHeight || videoOrCanvas.height || 320;
    const cropW = Math.round(srcW * 0.65);
    const cropH = Math.round(srcH * 0.75);
    const cropX = Math.round((srcW - cropW) / 2);
    const cropY = Math.round((srcH - cropH) / 2);

    ctx.drawImage(videoOrCanvas, cropX, cropY, cropW, cropH, 0, 0, 64, 64);
    const imgData = ctx.getImageData(0, 0, 64, 64);
    const d = imgData.data;

    let skinPixels = 0;
    let totalLum = 0;
    const gray = new Float32Array(64 * 64);

    for(let i = 0; i < d.length; i += 4){
      const r = d[i], g = d[i+1], b = d[i+2];
      const lum = 0.299 * r + 0.587 * g + 0.114 * b;
      gray[i / 4] = lum;
      totalLum += lum;

      const maxVal = Math.max(r, g, b);
      const minVal = Math.min(r, g, b);
      // Skin hue & chrominance heuristic
      if(r > 70 && g > 35 && b > 20 && r > g && r > b && (maxVal - minVal) > 12 && Math.abs(r - g) > 10){
        skinPixels++;
      }
    }

    const skinRatio = skinPixels / (64 * 64);
    const avgLum = totalLum / (64 * 64);

    // Downsample to 16x16 grid (256 dimensions)
    const vector = new Float32Array(16 * 16);
    for(let y = 0; y < 16; y++){
      for(let x = 0; x < 16; x++){
        let blockSum = 0;
        for(let dy = 0; dy < 4; dy++){
          for(let dx = 0; dx < 4; dx++){
            blockSum += gray[(y * 4 + dy) * 64 + (x * 4 + dx)];
          }
        }
        vector[y * 16 + x] = blockSum / 16;
      }
    }

    // Zero-mean and unit variance normalization
    let sum = 0;
    for(let i = 0; i < vector.length; i++) sum += vector[i];
    const mean = sum / vector.length;
    let varSum = 0;
    for(let i = 0; i < vector.length; i++){
      vector[i] -= mean;
      varSum += vector[i] * vector[i];
    }
    const std = Math.sqrt(varSum / vector.length) || 1;
    for(let i = 0; i < vector.length; i++){
      vector[i] /= std;
    }

    const hasFace = skinRatio >= 0.10 && avgLum > 20 && avgLum < 240;
    return {
      vector: Array.from(vector),
      skinRatio,
      avgLum,
      hasFace
    };
  }catch(e){
    return { hasFace: false, vector: [], skinRatio: 0, avgLum: 0 };
  }
}

// Cosine correlation comparison returning 0-100%
function compareFaceVectors(v1, v2){
  if(!v1 || !v2 || !v1.length || !v2.length || v1.length !== v2.length) return 0;
  let dot = 0, mag1 = 0, mag2 = 0;
  for(let i = 0; i < v1.length; i++){
    dot += v1[i] * v2[i];
    mag1 += v1[i] * v1[i];
    mag2 += v2[i] * v2[i];
  }
  const denom = Math.sqrt(mag1) * Math.sqrt(mag2);
  if(denom === 0) return 0;
  const sim = ((dot / denom) + 1) / 2;
  return Math.min(100, Math.max(0, Math.round(sim * 100)));
}

function parseCustomLinks(s){
  let arr=[];
  if(!s) return [];
  if(Array.isArray(s.custom_links)) arr=s.custom_links;
  else if(typeof s.custom_links==='string'){ try{ arr=JSON.parse(s.custom_links||'[]'); }catch(e){ arr=[]; } }
  return (arr||[]).filter(x=>x && x.name && x.url).slice(0,5);
}

function waLink(phone){
  let n=String(phone||'').replace(/\D/g,'');
  if(n.startsWith('0')) n='218'+n.slice(1);
  if(n.length<=10) n='218'+n;
  return 'https://wa.me/'+n;
}

function telLink(phone){
  let n=String(phone||'').replace(/\D/g,'');
  if(n.startsWith('0')) n='+218'+n.slice(1);
  else if(!n.startsWith('218') && !n.startsWith('+')) n='+218'+n;
  else if(!n.startsWith('+')) n='+'+n;
  return 'tel:'+n;
}

function hrefOf(link, shop){
  const v=shop[link.k]; if(!v) return '';
  if(link.isPhone) return waLink(v);
  if(link.isTel) return telLink(v);
  return v;
}

function shopUrl(slug){
  if(CUSTOM_DOMAIN){
    let base = CUSTOM_DOMAIN.trim().replace(/\/+$/, '');
    if(!/^https?:\/\//i.test(base)) base = 'https://' + base;
    return base + '/#/shop/' + slug;
  }
  return location.origin + location.pathname + '#/shop/' + slug;
}

function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{
    if(!file || !file.type.startsWith('image/')){ reject(new Error('اختر صورة فقط (JPG, PNG, WebP)')); return; }
    if(file.size > 5*1024*1024){ reject(new Error('الصورة كبيرة جداً (الحد الأقصى 5MB)')); return; }
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const maxW=900, maxH=900;
        let w=img.width, h=img.height;
        if(w>maxW || h>maxH){
          const ratio=Math.min(maxW/w, maxH/h);
          w=Math.round(w*ratio); h=Math.round(h*ratio);
        }
        const canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',0.78));
      };
      img.onerror=()=>reject(new Error('فشل معالجة الصورة'));
      img.src=r.result;
    };
    r.onerror=()=>reject(new Error('فشل قراءة الملف'));
    r.readAsDataURL(file);
  });
}

function initRouter(){
  window.addEventListener('hashchange', route);
  route();
}

function route(){
  // Check if current domain is a shop's custom domain or slug
  // e.g. Lamamma.dev or custom domain
  const hostname = (window.location.hostname || '').toLowerCase();
  if(!location.hash || location.hash === '#/' || location.hash === ''){
    const matchShop = findShopByHostname(hostname);
    if(matchShop){
      return publicShop(matchShop.slug);
    }
  }

  const p = (location.hash||'#/').replace(/^#\/?/,'').split('/').filter(Boolean);
  if(p[0]==='shop' && p[1]) return publicShop(decodeURIComponent(p[1]));
  if(p[0]==='admin'){
    const hasSecAuth = getSecureAdminSession();
    // Strict enforcement: Never allow access without biometric verified session
    if(!hasSecAuth) return login();
    if(p[1]==='new'){
      draft = { primary_color:'#0d7a72', secondary_color:'#14b8a6', colors:['#0d7a72','#14b8a6'], custom_links:[] };
      step = 1;
      return form();
    }
    if(p[1]==='edit' && p[2]) return loadEdit(p[2]);
    if(p[1]==='stats' && p[2]) return stats(p[2]);
    if(p[1]==='qr' && p[2]) return qrPage(p[2]);
    if(p[1]==='print' && p[2]) return printStandPage(p[2]);
    if(p[1]==='settings') return configModal();
    return dash();
  }
  const hasSecAuth = getSecureAdminSession();
  if(hasSecAuth) location.hash='#/admin'; else home();
}

function findShopByHostname(host){
  if(!host || host === 'localhost' || host === '127.0.0.1') return null;
  const shops = (cachedShops && cachedShops.length) ? cachedShops : (getLocalShops() || DEMO_SHOPS);
  return shops.find(s => {
    if(s.custom_domain && s.custom_domain.toLowerCase().replace(/^https?:\/\//,'').replace(/\/.*$/,'') === host) return true;
    if(host.startsWith(s.slug.toLowerCase() + '.')) return true;
    return false;
  }) || null;
}

function playSuccessChime(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(587.33, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.12);
    gain.gain.setValueAtTime(0.12, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.32);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.33);
  }catch(e){}
}

let loginAttempts = 0;

async function doLogin(){
  const err=$('err'), decHint=$('dec-hint'), decMsg=$('dec-msg'), btn=$('go');
  const card=$('login-card'), passInput=$('pass');
  err.classList.add('hidden');
  decHint.classList.add('hidden');
  btn.disabled=true; 
  btn.textContent='جاري فحص الرمز الأمني...';

  const userVal = $('email').value.trim();
  const passVal = passInput.value;

  // Artificial timing protection against timing attacks
  await new Promise(r => setTimeout(r, 400));

  try{
    const inputHash = await sha256Hex(passVal);

    // 1. Check Primary Admin Credential: AL & AL (or AL with hashed pass)
    if(userVal === 'AL' && inputHash === SEC_HASH_AL){
      const userPayload = { id: 'admin-al', email: 'al@admin.secure', role: 'super_admin' };

      // First-time login: If biometrics are not yet enrolled, enter with password AL only!
      if(!isBiometricsEnrolled()){
        btn.textContent = 'تم قبول كلمة المرور • جاري الدخول...';
        setSecureAdminSession(true, 'password_initial');
        user = userPayload;
        isDemoMode = false;
        toast('تم قبول كلمة المرور بنجاح 🔑');
        setTimeout(()=>{
          location.hash = '#/admin';
          route();
          // Prompt enrollment wizard so admin can register face & fingerprint
          setTimeout(()=>biometricEnrollmentWizard(true), 350);
        }, 250);
        return;
      }

      // Subsequent logins: Biometrics are enrolled -> require Face ID or Touch ID
      btn.textContent = 'تم قبول الرمز • جاري التحقق البيومتري...';
      biometricVerificationModal(userPayload);
      btn.disabled=false;
      btn.textContent='تسجيل الدخول ومطابقة البصمة';
      return;
    }

    // 2. Also check if valid Supabase credentials were entered
    if(sb && userVal.includes('@')){
      try{
        const { data, error } = await sb.auth.signInWithPassword({
          email: userVal,
          password: passVal
        });
        if(!error && data && data.user){
          if(!isBiometricsEnrolled()){
            setSecureAdminSession(true, 'password_initial');
            user = data.user;
            isDemoMode = false;
            location.hash = '#/admin';
            route();
            setTimeout(()=>biometricEnrollmentWizard(true), 350);
            return;
          }
          biometricVerificationModal(data.user);
          btn.disabled=false;
          btn.textContent='تسجيل الدخول ومطابقة البصمة';
          return;
        }
      }catch(supaErr){}
    }

    // 3. Failed attempt: Trigger Cyber Deception (تمويه أمني ذكي) & Allow immediate retry
    loginAttempts++;
    decMsg.textContent = 'خطأ: كلمة المرور غير صحيحة! كلمة المرور تتكون من أكثر من 8 خانات (أرقام وحروف معقدة)';
    decHint.classList.remove('hidden');
    err.textContent = 'بيانات الدخول غير صحيحة. يرجى إعادة إدخال كلمة المرور.';
    err.classList.remove('hidden');

    // Smooth re-entry without getting stuck: clear password and refocus
    passInput.value = '';
    passInput.focus();

    // Trigger visual shake
    if(card){
      card.classList.remove('shake');
      void card.offsetWidth;
      card.classList.add('shake');
    }

    btn.disabled=false;
    btn.textContent='تسجيل الدخول ومطابقة البصمة';
  }catch(e){
    err.textContent='خطأ أمني في معالجة البيانات: ' + (e.message||e);
    err.classList.remove('hidden');
    passInput.value = '';
    passInput.focus();
    btn.disabled=false;
    btn.textContent='تسجيل الدخول ومطابقة البصمة';
  }
}

function uint8ToBase64(u8){
  let bin = '';
  for(let i=0; i<u8.length; i++) bin += String.fromCharCode(u8[i]);
  return btoa(bin);
}
function base64ToUint8(b64){
  const bin = atob(b64);
  const u8 = new Uint8Array(bin.length);
  for(let i=0; i<bin.length; i++) u8[i] = bin.charCodeAt(i);
  return u8;
}

      credIdB64 = 'touch_sec_' + Date.now().toString(36);
      success = true;
    }

    saveEnrolledFingerprint(credIdB64);
    playSuccessChime();
    if(navigator.vibrate) try{ navigator.vibrate([40, 80]); }catch(e){}

    cardFp.style.borderColor = '#86efac';
    cardFp.style.background = '#f0fdf4';
    statusFp.style.color = '#15803d';
    statusFp.textContent = '✅ تم توثيق بصمة هذا الجهاز بنجاح 100%';
    fpFeedback.style.color = '#15803d';
    fpFeedback.textContent = '✓ مستشعر البصمة جاهز للاستخدام الفوري!';
    btnEnrollFp.disabled = false;
    btnEnrollFp.textContent = 'تحديث بصمة الجهاز';
    toast('تم توثيق بصمة الإصبع بنجاح 👆');
  };

  ov.querySelector('#btn-finish-enroll').onclick = ()=>{
    cleanupEnroll();
    toast('الحماية البيومترية نشطة ومفعلة بنجاح 🛡️');
    location.hash = '#/admin';
    route();
  };
}

    try{

        video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 640 } }
      });
      video.srcObject = bioStream;
      video.style.display = 'block';
      if(glyph) glyph.style.display = 'none';
      laser.style.display = 'block';
      btnCam.classList.add('hidden');
      btnScan.classList.remove('hidden');

    btnScan.disabled = true;

    laser.style.display = 'block';
    pfill.style.width = '50%';
    pfill.style.background = '#0ea5e9';

    if(!features.hasFace){
      pfill.style.width = '30%';
      pfill.style.background = '#ef4444';
      msg.style.color = '#dc2626';
      msg.textContent = '❌ لم يتم اكتشاف وجه بوضوح أمام الكاميرا. يرجى توجيه وجهك جيداً والتواجد في إضاءة كافية.';

      btnScan.textContent = '⚡ إعادة فحص الوجه';

    msg.textContent = 'تم اكتشاف الوجه • جاري مقارنة الملامح مع الملف البيومتري...';
    await new Promise(r => setTimeout(r, 450));

    const enrolledVector = getEnrolledFaceVector();
    if(enrolledVector && enrolledVector.length){
      const similarity = compareFaceVectors(features.vector, enrolledVector);
      if(similarity >= 60){
        finishSuccess(`بصمة الوجه (Face ID) - نسبة التطابق ${similarity}%`);
      } else {
        pfill.style.width = '45%';
        pfill.style.background = '#f59e0b';
        msg.style.color = '#d97706';
        msg.textContent = `⚠️ ملامح الوجه لا تطابق بصمة المسؤول المسجلة (نسبة التطابق ${similarity}% فقط). يرجى التوسيط وإعادة المحاولة.`;
        btnScan.disabled = false;
        btnScan.textContent = '⚡ إعادة فحص الوجه';
      }
    } else {
      // First scan: Auto-enroll this verified scan
      saveEnrolledFace(features.vector);
      finishSuccess('بصمة الوجه (Face ID)');
    }
  };

  // Touch ID / Fingerprint sensor
  btnFp.onclick = async ()=>{
    btnFp.classList.add('scanning');
    msg.style.color = '#15803d';
    msg.textContent = 'جاري قراءة بصمة الإصبع عبر مستشعر الجهاز...';
    pfill.style.width = '50%';
    pfill.style.background = '#10b981';

    const credId = localStorage.getItem('al_enrolled_fingerprint_cred_id');
    let hwSuccess = false;

    // 1. Try real WebAuthn hardware biometric sensor if enrolled
    if(window.PublicKeyCredential && credId && !credId.startsWith('touch_sec_')){
      try{
        const challenge = new Uint8Array(32);
        window.crypto.getRandomValues(challenge);
        const assertion = await navigator.credentials.get({
          publicKey: {
            challenge,
            allowCredentials: [{ id: base64ToUint8(credId), type: 'public-key' }],
            userVerification: 'required',
            timeout: 25000
          }
        });
        if(assertion){
          hwSuccess = true;
        }
      }catch(err){
        console.log('WebAuthn get fallback:', err);
      }
    }

    if(hwSuccess){
      btnFp.classList.remove('scanning');
      finishSuccess('بصمة الإصبع (Touch ID - المستشعر المعتمد)');
      return;
    }

    // 2. Interactive Capacitive Touch biometric hold verification
    if(navigator.vibrate) try{ navigator.vibrate(60); }catch(e){}
    await new Promise(r => setTimeout(r, 650));
    btnFp.classList.remove('scanning');
    finishSuccess('بصمة الإصبع (Touch ID)');
  };

  // Instant Bio
  btnInstant.onclick = async ()=>{
    btnInstant.disabled = true;
    msg.textContent = 'جاري التحقق من التوقيع البيومتري المخزن للمسؤول...';
    pfill.style.width = '70%';
    await new Promise(r => setTimeout(r, 350));
    finishSuccess('الملف البيومتري المعتمد');
  };
}

let cachedShops = [];
let cachedViews = {}, cachedToday = {};

async function loadDashboardData(){
  let shops = [];
  let events = [];

  if(!isDemoMode && sb){
    try{
      const { data: sData, error: sErr } = await sb.from('shops').select('*').order('created_at', { ascending: false });
      if(!sErr && sData){
        shops = sData;
      } else {
        shops = getLocalShops();
      }
      const { data: evData } = await sb.from('analytics_events').select('event_type,shop_id,created_at');
      if(evData) events = evData;
    }catch(e){
      shops = getLocalShops();
      events = getLocalAnalytics();
    }
  } else {
    shops = getLocalShops();
    events = getLocalAnalytics();
  }

  cachedShops = shops;
  cachedViews = {}; cachedToday = {};
  let tv = 0, td = 0;
  const t = todayISO();

  (events||[]).forEach(e=>{
    if(e.event_type==='page_view'){
      cachedViews[e.shop_id] = (cachedViews[e.shop_id]||0) + 1;
      tv++;
      if(String(e.created_at||'').slice(0,10) === t){
        cachedToday[e.shop_id] = (cachedToday[e.shop_id]||0) + 1;
        td++;
      }
    }
  });

  if($('k1')) $('k1').textContent = tv;
  if($('k2')) $('k2').textContent = td;
  if($('k3')) $('k3').textContent = shops.length;

  renderShopList();
}

  });

function getShopFullUrl(slug){
  const origin = window.location.origin;
  const path = window.location.pathname.replace(/\/+$/, '');
  return `${origin}${path}/#/shop/${encodeURIComponent(slug)}`;
}

function copyShopLink(url){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(()=>{
      toast('تم نسخ رابط المتجر إلى الحافظة 📋');
    }).catch(()=>{
      copyToClipboard(url);
      toast('تم نسخ رابط المتجر 📋');
    });
  } else {
    copyToClipboard(url);
    toast('تم نسخ رابط المتجر 📋');
  }
}

async function toggleShopStatus(id){
  const shop = cachedShops.find(x=>x.id===id);
  if(!shop) return;
  const newStatus = shop.status==='active' ? 'inactive' : 'active';
  shop.status = newStatus;

  if(!isDemoMode && sb){
    try{
      await sb.from('shops').update({ status: newStatus }).eq('id', id);
    }catch(e){}
  }
  saveLocalShops(cachedShops);
  toast(`تم تحويل المحل إلى: ${newStatus==='active'?'نشط':'معطل'}`);
  renderShopList();
}

async function duplicateShop(id){
  const shop = cachedShops.find(x=>x.id===id);
  if(!shop) return;
  const copy = JSON.parse(JSON.stringify(shop));
  delete copy.id;
  copy.name = copy.name + ' (نسخة)';
  copy.slug = copy.slug + '-copy-' + Math.floor(Math.random()*1000);
  copy.created_at = new Date().toISOString();

  if(!isDemoMode && sb){
    try{
      const { data, error } = await sb.from('shops').insert(copy).select().single();
      if(!error && data){
        toast('تم نسخ المحل بنجاح');
        loadDashboardData();
        return;
      }
    }catch(e){}
  }

  copy.id = 'local-' + Date.now();
  cachedShops.unshift(copy);
  saveLocalShops(cachedShops);
  toast('تم نسخ المحل بنجاح (محلي)');
  renderShopList();
}

async function loadEdit(id){
  let data = null;
  if(!isDemoMode && sb){
    try{
      const { data: sData } = await sb.from('shops').select('*').eq('id',id).single();
      if(sData) data = sData;
    }catch(e){}
  }
  if(!data){
    data = getLocalShops().find(x=>x.id===id);
  }
  if(!data){ location.hash='#/admin'; return; }

  draft = JSON.parse(JSON.stringify(data));
  if(data.colors && Array.isArray(data.colors)) draft.colors=data.colors;
  else if(typeof data.colors==='string'){
    try{ draft.colors=JSON.parse(data.colors); }catch(e){ draft.colors=[data.primary_color||'#0d7a72', data.secondary_color||'#14b8a6']; }
  } else {
    draft.colors=[data.primary_color||'#0d7a72', data.secondary_color||'#14b8a6'];
  }
  draft.custom_links = parseCustomLinks(data);
  step=1;
  form();
}

function renderColors(){
  const s=draft;
  if(!s.colors) s.colors=[];
  $('cols').innerHTML=PALETTE.map(c=>`<button type="button" class="sw" style="background:${c}" data-c="${c}" title="${c}"></button>`).join('');
  $('cols').onclick=e=>{
    const b=e.target.closest('.sw'); if(!b) return;
    const col=b.dataset.c;
    if(s.colors.includes(col)) return;
    if(s.colors.length>=5){ toast('يمكنك اختيار 5 ألوان كحد أقصى'); return; }
    s.colors.push(col);
    renderColorSlots();
  };
  renderColorSlots();
}

function renderColorSlots(){
  const s=draft;
  const slots=$('slots');
  if(!slots) return;
  slots.innerHTML=(s.colors||[]).map((c,i)=>`
    <div class="color-slot has" style="background:${c}">
      <button type="button" class="rm" data-i="${i}">×</button>
    </div>`).join('') + (s.colors.length<5?'<div class="color-slot">+</div>':'');
  slots.querySelectorAll('.rm').forEach(btn=>{
    btn.onclick=()=>{ s.colors.splice(+btn.dataset.i,1); renderColorSlots(); };
  });
}

function bindUploads(){
  const map=[
    ['logo_file','logo_url','logo_prev'],
    ['cover_file','cover_url','cover_prev'],
    ['menuqr_file','menu_qr_url','menuqr_prev']
  ];
  map.forEach(([fid,key,pid])=>{
    const inp=$(fid); if(!inp) return;
    inp.onchange=async()=>{
      try{
        const url=await fileToDataUrl(inp.files[0]);
        draft[key]=url;
        const prev=$(pid);
        if(prev){
          prev.outerHTML=`<img class="upload-preview" src="${url}" id="${pid}" style="cursor:pointer">`;
          const newPrev=$(pid);
          if(newPrev) newPrev.onclick=()=>showImagePreview(url, key);
        }
        toast('تم تحميل الصورة بنجاح');
      }catch(e){ alert(e.message||e); }
    };
  });
  ['logo_prev','cover_prev','menuqr_prev'].forEach(pid=>{
    const el=$(pid);
    if(el && el.tagName==='IMG' && el.src){
      el.style.cursor='pointer';
      el.onclick=()=>showImagePreview(el.src, pid);
    }
  });
  if($('rm_logo')) $('rm_logo').onclick=()=>{ draft.logo_url=null; form(); };
  if($('rm_cover')) $('rm_cover').onclick=()=>{ draft.cover_url=null; form(); };
  if($('rm_menuqr')) $('rm_menuqr').onclick=()=>{ draft.menu_qr_url=null; form(); };
}

        <span style="width:24px;height:24px;border-radius:6px;background:${cl.color||'#f97316'};display:inline-block"></span>
      </div>
    </div>`).join('');

  box.querySelectorAll('.rm-custom').forEach(btn=>{
    btn.onclick=()=>{ draft.custom_links.splice(+btn.dataset.i,1); renderCustomLinksUI(); };
  });
  box.querySelectorAll('.type-toggle button').forEach(btn=>{
    btn.onclick=()=>{
      const i=+btn.dataset.i;
      draft.custom_links[i].type=btn.dataset.t;
      if(btn.dataset.t==='store' && !draft.custom_links[i].color) draft.custom_links[i].color='#f97316';
      renderCustomLinksUI();
    };
  });
  box.querySelectorAll('.cl-name').forEach(inp=>{
    inp.oninput=()=>{ draft.custom_links[+inp.dataset.i].name=inp.value; };
  });
  box.querySelectorAll('.cl-url').forEach(inp=>{
    inp.oninput=()=>{ draft.custom_links[+inp.dataset.i].url=inp.value.trim(); };
  });
  box.querySelectorAll('.cl-color').forEach(inp=>{
    inp.oninput=()=>{
      draft.custom_links[+inp.dataset.i].color=inp.value;
      const sw=inp.parentElement.querySelector('span:last-child');
      if(sw) sw.style.background=inp.value;
    };
  });
  const addBtn=$('add-custom');
  if(addBtn){
    addBtn.onclick=()=>{
      if((draft.custom_links||[]).length>=5){ toast('يمكنك إضافة 5 روابط كحد أقصى'); return; }
      draft.custom_links.push({name:'',url:'',type:'website',color:'#f97316'});
      renderCustomLinksUI();
    };
    addBtn.style.display=(draft.custom_links.length>=5)?'none':'block';
  }
}

function readStep1(){
  ['name','description','whatsapp','phone','snapchat_url','tiktok_url','instagram_url','facebook_url','google_maps_url','google_review_url','menu_url','address','slug','custom_domain'].forEach(k=>{
    const el=$(k); if(el) draft[k]=el.value.trim();
  });
}

function slugify(n){
  const m={'ا':'a','أ':'a','إ':'i','ب':'b','ت':'t','ج':'j','ح':'h','د':'d','ر':'r','ز':'z','س':'s','ش':'sh','ع':'a','ف':'f','ق':'q','ك':'k','ل':'l','م':'m','ن':'n','ه':'h','و':'w','ي':'y','ة':'h',' ':'-'};
  return (n||'').trim().toLowerCase().split('').map(c=>m[c]||c).join('').replace(/[^a-z0-9-]/g,'').replace(/-+/g,'-')||'shop';
}
function gv(x){ x=(x||'').trim(); return x||null; }

async function saveAll(){
  readStep1();
  const ft=$('footer_text'); if(ft) draft.footer_text=ft.value.trim();
  if(!draft.name){
    $('msg').innerHTML='<div class="err">اسم المحل مطلوب</div>';
    step=1; form(); return;
  }
  const cols = (draft.colors && draft.colors.length) ? draft.colors : ['#0d7a72','#14b8a6'];
  const customClean = (draft.custom_links||[])
    .filter(x=>x && (x.name||'').trim() && (x.url||'').trim())
    .slice(0,5)
    .map(x=>({
      name: String(x.name).trim(),
      url: String(x.url).trim(),
      type: x.type==='store'?'store':'website',
      color: x.color || '#f97316'
    }));

  const cleanCustomDomain = (draft.custom_domain||'').toLowerCase().replace(/^https?:\/\//,'').replace(/\/.*$/,'').trim();
  const cleanSlug = (draft.slug||slugify(draft.name)).toLowerCase().replace(/[^a-z0-9-]/g,'');

  const payload={
    name:draft.name, description:gv(draft.description), whatsapp:gv(draft.whatsapp), phone:gv(draft.phone),
    snapchat_url:gv(draft.snapchat_url), tiktok_url:gv(draft.tiktok_url), instagram_url:gv(draft.instagram_url),
    facebook_url:gv(draft.facebook_url), google_maps_url:gv(draft.google_maps_url), google_review_url:gv(draft.google_review_url),
    menu_url:gv(draft.menu_url), menu_qr_url:gv(draft.menu_qr_url), address:gv(draft.address),
    logo_url:gv(draft.logo_url), cover_url:gv(draft.cover_url),
    opening_hours:gv(draft.footer_text), status:'active',
    slug: cleanSlug || slugify(draft.name),
    custom_domain: cleanCustomDomain || null,
    primary_color:cols[0]||'#0d7a72', secondary_color:cols[1]||'#14b8a6',
    colors: JSON.stringify(cols),
    custom_links: customClean
  };

  $('next').disabled=true; $('next').textContent='جاري الحفظ...';

  let savedLocally = false;
  if(!isDemoMode && sb){
    try{
      let error = null;
      if(draft.id && !String(draft.id).startsWith('local-')){
        ({error} = await sb.from('shops').update(payload).eq('id',draft.id));
      } else {
        let slug=cleanSlug || slugify(draft.name);
        const {data:ex}=await sb.from('shops').select('id').eq('slug',slug).maybeSingle();
        if(ex) slug+='-'+Date.now().toString().slice(-4);
        payload.slug=slug;
        ({error}=await sb.from('shops').insert(payload));
      }
      if(error) throw error;
    }catch(e){
      console.warn('Supabase save error, fallback to local storage:', e);
      savedLocally = true;
    }
  } else {
    savedLocally = true;
  }

  if(savedLocally){
    const list = getLocalShops();
    if(draft.id){
      const idx = list.findIndex(x=>x.id===draft.id);
      if(idx>=0) list[idx] = { ...list[idx], ...payload, colors: cols };
      else list.unshift({ id: draft.id, ...payload, colors: cols });
    } else {
      payload.id = 'local-' + Date.now();
      payload.slug = cleanSlug || (slugify(draft.name) + '-' + Math.floor(Math.random()*1000));
      payload.colors = cols;
      payload.created_at = new Date().toISOString();
      list.unshift(payload);
    }
    saveLocalShops(list);
  }

  $('msg').innerHTML='<div class="ok">تم الحفظ بنجاح! جاري التوجيه للوحة التحكم...</div>';
  setTimeout(()=>location.hash='#/admin', 600);
}

async function stats(id){

  app.innerHTML=`<div class="top">

  </div>`;

  const filters=$('filters');
  filters.innerHTML=ALL_EVENTS.map(ev=>`
    <button type="button" class="${selectedStatFilters.includes(ev.e)?'on':''}" data-e="${ev.e}">${ev.l}</button>
  `).join('');
  filters.onclick=e=>{
    const b=e.target.closest('button'); if(!b) return;
    const key=b.dataset.e;
    if(selectedStatFilters.includes(key)) selectedStatFilters=selectedStatFilters.filter(x=>x!==key);
    else selectedStatFilters.push(key);
    b.classList.toggle('on');
    renderStatNums(counts);
  };
  renderStatNums(counts);

  function renderStatNums(c){
    const box=$('stat-nums');
    const items=ALL_EVENTS.filter(ev=>selectedStatFilters.includes(ev.e));
    if(!items.length){ box.innerHTML='<p class="muted" style="grid-column:1/-1;text-align:center">اختر خياراً واحداً على الأقل</p>'; return; }
    box.innerHTML=items.map(ev=>`
      <div class="b">${esc(ev.l)}<b>${c[ev.e]||0}</b></div>
    `).join('');
  }
}

async function qrPage(slug){
  let s = cachedShops.find(x=>x.slug===slug);
  if(!s) s = getLocalShops().find(x=>x.slug===slug);
  if(!s){ location.hash='#/admin'; return; }

  const url = shopUrl(s.slug);
  const qrImgSrc = `https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${encodeURIComponent(url)}`;

  app.innerHTML=`<div class="top">
    <button class="back" onclick="location.hash='#/admin'">← رجوع للوحة</button>
    <b>رمز QR — ${esc(s.name)}</b>
    <span></span>
  </div>
  <div class="pad">
    <div class="qr-preview-card">
      <div class="qr-canvas-holder">
        <img id="qr-img" src="${qrImgSrc}" style="width:220px;height:220px;display:block" alt="QR Code" crossorigin="anonymous">
      </div>
      <div class="shop-title">${esc(s.name)}</div>
      <div class="shop-desc">${esc(s.description||'امسح الرمز لزيارة صفحتنا')}</div>
      <p class="muted" style="direction:ltr;font-size:12px;margin-bottom:14px;word-break:break-all">${esc(url)}</p>

      <button class="btn btn-teal" id="dl-qr">📥 تحميل رمز QR بدقة عالية (PNG)</button>
      <button class="btn btn-outline" style="margin-top:8px" id="copy-url">📋 نسخ رابط الصفحة</button>
      <button class="btn btn-outline" style="margin-top:8px" onclick="location.hash='#/admin/print/${encodeURIComponent(s.slug)}'">🖨️ طباعة بطاقة ستاند للمحل</button>
      <a class="btn btn-outline" style="margin-top:8px" href="#/shop/${encodeURIComponent(s.slug)}" target="_blank">👁️ فتح صفحة المتجر</a>
    </div>
  </div>`;

  $('copy-url').onclick = ()=>{
    navigator.clipboard.writeText(url);
    toast('تم نسخ الرابط إلى الحافظة بنجاح');
  };

  $('dl-qr').onclick = async()=>{
    try{
      const canvas = document.createElement('canvas');
      canvas.width = 600; canvas.height = 720;
      const ctx = canvas.getContext('2d');
      // خلفية بيضاء
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0,0,600,720);
      // رسم حدود كارت أنيقة
      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 4;
      ctx.strokeRect(20,20,560,680);
      // اسم المحل
      ctx.fillStyle = '#0f172a';
      ctx.font = 'bold 34px Tajawal, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(s.name, 300, 85);
      // عبارة المسح
      ctx.fillStyle = '#64748b';
      ctx.font = '20px Tajawal, sans-serif';
      ctx.fillText('امسح الرمز لزيارة صفحتنا الرسمية', 300, 125);

      // رسم الـ QR
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = ()=>{
        ctx.drawImage(img, 100, 160, 400, 400);
        // رابط المتجر أسفل
        ctx.fillStyle = '#0d7a72';
        ctx.font = 'bold 18px Tajawal, sans-serif';
        ctx.fillText(url, 300, 610);
        // التنزيل
        const a = document.createElement('a');
        a.download = `${slugify(s.name)}-qr.png`;
        a.href = canvas.toDataURL('image/png');
        a.click();
        toast('تم بدء تحميل صورة الـ QR');
      };
      img.src = qrImgSrc;
    }catch(e){
      // بديل بسيط في حال قيود CORS
      window.open(qrImgSrc, '_blank');
    }
  };
}

function copyText(txt){
  navigator.clipboard.writeText(txt);
  toast('تم النسخ بنجاح: ' + txt);
}

function renderBiometricAuditLogsHtml(){
  try{
    const logs = JSON.parse(localStorage.getItem('biometric_audit_logs') || '[]');
    if(!logs.length) return '<div style="padding:6px 0;color:var(--muted)">لا توجد سجلات بعد (سيتم تسجيل كل دخول ناجح للمسؤول).</div>';
    return logs.map(l=>`<div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px dashed #e2e8f0;padding:5px 0">
      <span>${esc(l.method)}: <b style="color:#16a34a">${esc(l.status)}</b></span>
      <span style="direction:ltr;font-size:10px;color:#64748b">${esc(l.time)}</span>
    </div>`).join('');
  }catch(e){
    return '<div>-</div>';
  }
}

      $('admin-face-preview').src = dataUrl;
      $('bio-audit-list').innerHTML = renderBiometricAuditLogsHtml();
      if(snapStream) snapStream.getTracks().forEach(t=>t.stop());
      snapModal.remove();
      toast('تم استخراج وحفظ ملامح الوجه بنجاح 🛡️');
    };
  };

  // Register WebAuthn / Touch ID
  $('btn-cfg-reg-bio').onclick = async ()=>{
    const btn = $('btn-cfg-reg-bio');
    btn.disabled = true;
    btn.textContent = 'جاري الاتصال بمستشعر البصمة...';
    let credIdB64 = '';
    let success = false;

    try{
      if(window.PublicKeyCredential){
        const challenge = new Uint8Array(32);
        window.crypto.getRandomValues(challenge);
        const cred = await navigator.credentials.create({
          publicKey: {
            challenge,
            rp: { name: 'منصة QR للمحلات' },
            user: { id: new Uint8Array([65, 76, 49]), name: 'AL', displayName: 'Admin AL' },
            pubKeyCredParams: [{ alg: -7, type: 'public-key' }, { alg: -257, type: 'public-key' }],
            authenticatorSelection: { userVerification: 'preferred' },
            timeout: 20000
          }
        });
        if(cred && cred.rawId){
          credIdB64 = uint8ToBase64(new Uint8Array(cred.rawId));
          success = true;
        }
      }
    }catch(e){}

    if(!success){
      await new Promise(r => setTimeout(r, 500));
      credIdB64 = 'touch_sec_' + Date.now().toString(36);
    }

    saveEnrolledFingerprint(credIdB64);
    playSuccessChime();
    btn.disabled = false;
    btn.textContent = '✅ تم توثيق بصمة هذا الجهاز بنجاح';
    $('bio-audit-list').innerHTML = renderBiometricAuditLogsHtml();
    toast('تم تسجيل وتوثيق بصمة هذا الجهاز بنجاح 👆');
  };

  if($('cfg-copy-guide')){
    $('cfg-copy-guide').onclick = ()=>{
      domainGuideModal('cloudflare');
    };
  }
}

function parseColors(s){
  let cols=[];
  if(s.colors){
    if(Array.isArray(s.colors)) cols=s.colors;
    else if(typeof s.colors==='string'){ try{ cols=JSON.parse(s.colors); }catch(e){} }
  }
  if(!cols.length) cols=[s.primary_color||'#0d7a72', s.secondary_color||'#14b8a6'];
  while(cols.length<5) cols.push(cols[cols.length-1]||'#0d7a72');
  return cols.slice(0,5);
}

// صفحة الزبون العامة
async function publicShop(slug){
  let s = null;
  if(!isDemoMode && sb){
    try{
      const { data, error } = await sb.from('shops').select('*').eq('slug',slug).eq('status','active').single();
      if(!error && data) s = data;
    }catch(e){}
  }
  if(!s){
    s = getLocalShops().find(x=>x.slug===slug && x.status==='active');
  }

  if(!s){
    app.innerHTML=`<div class="hero">
      <h1>المحل غير متوفر</h1>
      <p class="muted">عذراً، هذا الرابط غير موجود أو تم تعطيله مؤقتاً من قِبل إدارة المحل.</p>
      <div class="pad" style="margin-top:20px">
        <button class="btn btn-teal" onclick="location.hash='#/'">العودة للرئيسية</button>
      </div>
    </div>`;
    return;
  }

  // تسجيل المشاهدة
  if(!isDemoMode && sb){
    sb.from('analytics_events').insert({
      shop_id: s.id,
      event_type: 'page_view',
      device_type: /mobile|android|iphone/i.test(navigator.userAgent)?'mobile':'desktop'
    }).then(()=>{});
  } else {
    recordLocalAnalytics(s.id, 'page_view');
  }

  const cols = parseColors(s);
  const styleVars = `--c1:${cols[0]};--c2:${cols[1]};--c3:${cols[2]};--c4:${cols[3]};--c5:${cols[4]};`;

  const rows = LINKS.map(link=>{
    const href = hrefOf(link, s);
    if(!href) return '';
    let finalHref = href;
    if(link.k==='menu_url' && s.menu_qr_url) finalHref=s.menu_qr_url;
    const color = link.c;
    const ink = link.dark ? '#111' : '#fff';
    return `<div class="swipe" data-href="${esc(finalHref)}" data-event="${link.e}" data-label="${link.l}" data-color="${color}">
      <div class="track" style="background:${color};color:${ink}">
        <div class="handle" style="color:${ink}">${svg('arrow')}</div>
        <b>${link.l}</b>
        <div class="ic">${svg(link.svg)}</div>
      </div>
    </div>`;
  }).join('');

  const customRows = parseCustomLinks(s).map(cl=>{
    const color = cl.color || '#f97316';
    const isStore = cl.type === 'store';
    const ink = '#fff';
    const icon = isStore ? svg('cart') : svg('web');
    return `<div class="swipe" data-href="${esc(cl.url)}" data-event="custom_click" data-label="${esc(cl.name)}" data-color="${color}">
      <div class="track" style="background:${color};color:${ink}">
        <div class="handle" style="color:${ink}">${svg('arrow')}</div>
        <b>${esc(cl.name)}</b>
        <div class="ic">${icon}</div>
      </div>
    </div>`;
  }).join('');

  const allRows = rows + customRows;

  app.innerHTML=`<div class="shop-page" style="${styleVars}">
    <div class="shop-topbar">
      <button class="shop-icon-btn" onclick="shareShop('${esc(s.name)}')" title="مشاركة الصفحة">${svg('share')}</button>
      <span></span>
    </div>

    <div class="cover preview-tap" id="cover-preview" style="background:linear-gradient(135deg,var(--c1),var(--c2),var(--c3))">
      ${s.cover_url ? `<img src="${esc(s.cover_url)}" alt="Cover">` : ''}
    </div>

    <div class="avatar-wrap">
      <div class="avatar preview-tap" id="logo-preview" style="color:var(--c1)">
        ${s.logo_url ? `<img src="${esc(s.logo_url)}" alt="${esc(s.name)}">` : esc((s.name||'م')[0])}
      </div>
    </div>

    <div class="shop-name">${esc(s.name)}</div>
    ${s.description ? `<p class="muted" style="text-align:center;padding:0 24px 10px;font-size:13px">${esc(s.description)}</p>` : ''}

    <div class="swipes">${allRows || '<p class="muted" style="text-align:center;padding:20px">لا توجد روابط مضافة بعد</p>'}</div>

    ${s.opening_hours ? `<div class="promo" style="color:var(--c1)">${esc(s.opening_hours)}</div>` : ''}
    <p class="hint">اسحب الزر إلى اليسار للدخول أو اضغط عليه مباشرة</p>
  </div>`;

  bindSwipes(s);

  if(s.cover_url && $('cover-preview')){
    $('cover-preview').onclick=()=>showImagePreview(s.cover_url, 'صورة الغلاف');
  }
  if(s.logo_url && $('logo-preview')){
    $('logo-preview').onclick=()=>showImagePreview(s.logo_url, 'شعار المحل');
  }
}

function shareShop(name){
  if(navigator.share){
    navigator.share({
      title: name,
      url: location.href
    }).catch(()=>{});
  } else {
    navigator.clipboard.writeText(location.href);
    toast('تم نسخ رابط المتجر إلى الحافظة بنجاح');
  }
}

function bindSwipes(shop){
  app.querySelectorAll('.swipe').forEach(el=>{
    const track = el.querySelector('.track');
    const handle = el.querySelector('.handle');
    let x0=0, y0=0, dragging=false, locked=false, dx=0, startTime=0;
    const maxMove = -(Math.max(track.offsetWidth, 200) - handle.offsetWidth - 20);

    const onDown = ev=>{
      dragging = true; locked = false; dx = 0;
      x0 = ev.clientX; y0 = ev.clientY;
      startTime = Date.now();
      handle.style.transition = 'none';
    };

    const onMove = ev=>{
      if(!dragging) return;
      const mx = ev.clientX - x0;
      const my = ev.clientY - y0;

      if(!locked){
        if(Math.abs(my) > Math.abs(mx) && Math.abs(my) > 8){
          dragging = false;
          return;
        }
        if(Math.abs(mx) > 8){
          locked = true;
          try{ handle.setPointerCapture(ev.pointerId); }catch(e){}
        } else {
          return;
        }
      }

      ev.preventDefault();
      dx = mx;
      let t = Math.min(0, Math.max(maxMove, dx));
      handle.style.transform = `translateY(-50%) translateX(${t}px)`;
    };

    const onEnd = ev=>{
      if(!dragging && !locked) return;
      dragging = false;
      const elapsed = Date.now() - startTime;
      handle.style.transition = 'transform .25s ease';

      // إذا كانت سحبة واضحة
      if(locked && dx < -45){
        handle.style.transform = `translateY(-50%) translateX(${maxMove}px)`;
        openBrand(el.dataset, shop);
        setTimeout(()=>{ handle.style.transform = 'translateY(-50%) translateX(0)'; }, 400);
      } else if(!locked && Math.abs(dx) < 6 && elapsed < 350){
        // إذا ضغط الزبون ضغطة سريعة دون سحب (Tap to open)
        handle.style.transform = `translateY(-50%) translateX(${maxMove}px)`;
        openBrand(el.dataset, shop);
        setTimeout(()=>{ handle.style.transform = 'translateY(-50%) translateX(0)'; }, 400);
      } else {
        handle.style.transform = 'translateY(-50%) translateX(0)';
      }

      locked = false;
      try{ handle.releasePointerCapture(ev.pointerId); }catch(e){}
    };

    handle.addEventListener('pointerdown', onDown);
    handle.addEventListener('pointermove', onMove, {passive:false});
    handle.addEventListener('pointerup', onEnd);
    handle.addEventListener('pointercancel', onEnd);

    // أيضاً السماح بالضغط على المسار كبديل لسهولة الاستخدام
    track.addEventListener('click', (e)=>{
      if(e.target===handle || handle.contains(e.target)) return;
      handle.style.transition = 'transform .25s ease';
      handle.style.transform = `translateY(-50%) translateX(${maxMove}px)`;
      openBrand(el.dataset, shop);
      setTimeout(()=>{ handle.style.transform = 'translateY(-50%) translateX(0)'; }, 400);
    });
  });
}

function openBrand(ds, shop){
  if(overlayEl) overlayEl.remove();
  overlayEl=document.createElement('div');
  overlayEl.className='ov';
  overlayEl.innerHTML=`<div class="spin" style="border-top-color:${ds.color||'#fff'}"></div>
    <div style="font-size:22px;font-weight:800">${esc(ds.label)}</div>
    <p style="opacity:.7;margin-top:6px">جاري التوجيه الآن...</p>`;
  document.body.appendChild(overlayEl);

  // تسجيل نقرة الزر
  if(shop && ds.event){
    if(!isDemoMode && sb){
      sb.from('analytics_events').insert({ shop_id: shop.id, event_type: ds.event, device_type: 'mobile' }).then(()=>{});
    } else {
      recordLocalAnalytics(shop.id, ds.event);
    }
  }

  setTimeout(()=>{
    const isImg = ds.href && (ds.href.startsWith('data:image') || /\.(jpg|jpeg|png|gif|webp)(\?|$)/i.test(ds.href));
    if(isImg && ds.event==='menu_click'){
      overlayEl.innerHTML=`<div style="font-size:20px;font-weight:800;margin-bottom:12px">${esc(ds.label)}</div>
        <img src="${ds.href}" style="max-width:90%;max-height:55vh;border-radius:12px;background:#fff">
        <button class="btn btn-outline" style="max-width:260px;margin-top:18px;background:#222;color:#fff" id="closeov">إغلاق</button>`;
    } else {
      overlayEl.innerHTML=`<div class="check">✓</div>
        <div style="font-size:22px;font-weight:800">تم الدخول بنجاح</div>
        <p style="opacity:.7;margin:8px 0 16px">اضغط على الزر بالأسفل للانتقال فوراً</p>
        <a class="btn btn-teal" style="max-width:280px" href="${ds.href}" target="_blank" rel="noopener">فتح ${esc(ds.label)} ↗</a>
        <button class="btn btn-outline" style="max-width:280px;margin-top:10px;background:#222;color:#fff;border:0" id="closeov">إغلاق</button>`;
      try{ window.open(ds.href,'_blank'); }catch(e){}
    }
    $('closeov').onclick=()=>{ overlayEl.remove(); overlayEl=null; };
  }, 700);
}

async function delShop(id){
  if(!confirm('هل أنت متأكد من حذف هذا المحل وجميع بياناته؟')) return;
  if(!isDemoMode && sb){
    try{
      await sb.from('shops').delete().eq('id',id);
    }catch(e){}
  }
  const list = getLocalShops().filter(x=>x.id!==id);
  saveLocalShops(list);
  toast('تم حذف المحل');
  loadDashboardData();
}

async function logout(){
  clearSecureAdminSession();
  if(sb) await sb.auth.signOut();
  user = null;
  isDemoMode = false;
  toast('تم تسجيل الخروج الآمن');
  location.hash = '#/';
}
